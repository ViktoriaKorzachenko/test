<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Registration</title>
</head>

<body class="content">
    <header class="upper-button">
        <div class="buttons-container">
            <button class="login-button">Login</button>
            <button class="register-button">Register</button>
        </div>
    </header>
    <main>
        <p class="text-before-registration">Enter your email and password to register. </p>
        <form action="" method="">

            <label>
                <input type="text" placeholder="Username" name="username" required>
            </label>

            <label>
                <input type="email" placeholder="Enter your email address" name="email" required>
            </label>

            <label>
                <input type="password" placeholder="Password" name="password" required>
            </label>

            <label>
                <input type="password" placeholder="Confirm Password" name="confirm_password" required>
            </label>

            <button type="submit" class="button-register">Register</button>

        </form>
        <p class="text-before-last-button">Or register with</p>
        <div>
            <button class="buttons-for-google">
                <img src="img/Group.png" class="buttons-img">
                Continue with Google</button>
            <button class="buttons-for-facebook" class="buttons-img">
                <img src="img/facebook 1.png">
                Continue with Facebook</button>
        </div>
    </main>
</body>

</html>
