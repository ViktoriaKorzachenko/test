<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Menu-banner</title>
</head>

<body class="body">
    <div class="wrapper">
        <header class="header-menu">
            <a href="#" class="upper-logo">
                <img src="img/logo.png" alt="">
            </a>
            <ul class="links-to-pages">
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Plant Care</a></li>
                <li><a href="#">Blogs</a></li>
            </ul>
            <button class="button-login" type="button"> <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 20 20" fill="none">
                    <path d="M18.1592 10.1006H8.125" stroke="white" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M15.7203 7.67059L18.1603 10.1006L15.7203 12.5306" stroke="white" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round" />
                    <path

                        stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg><span>Login</span>
            </button>
        </header>
        <main>
            <section class="main-banner">
                <div class="banner-text">
                    <div class="first-banner-text">
                        <h2>welcome to greenshop</h2>
                    </div>
                    <div class="second-banner-text">
                        <h1 class="text-h1">let’s make a better <span>Planet</span></h1>
                    </div>
                    <p class="banner-paragraph">We are an online plant shop offering a wide range of cheap and trendy
                        plants. Use our plants to
                        create an unique Urban Jungle. Order your favorite plants!</p>
                    <button class="button-to-shop" type="button"><span>shop now</span></button>
                </div>
                <div class="banner-img"> <img src="img/baner.png" alt=""></div>
            </section>
        </main>
    </div>

</html>
